services:
  auto:
    build:
      context: .
      dockerfile: Dockerfile.auto
    image: browser-use-auto:latest
    container_name: browser-use-auto
    env_file:
      - .env
    environment:
      AUTO_DATA_DIR: /app/auto/data
      AUTO_LOG_DIR: /app/auto/logs
      AUTO_REMOTE_PROFILE_DIR: /app/auto/data/remote_profiles
      CLOUDFLARED_PATH: /usr/local/bin/cloudflared
      REMOTE_LOGIN_TIMEOUT_SECONDS: "600"
    ports:
      - "19000:19000"
    volumes:
      - ./runtime/auto-data:/app/auto/data
      - ./runtime/auto-logs:/app/auto/logs
      - ./runtime/api-logs:/app/api/logs
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19000/api/v1/auto/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
