services:
  publish:
    build:
      context: .
    image: browser-publish-service:latest
    container_name: browser-publish-service
    # init 进程负责回收 Chrome / Xvfb 等子进程产生的僵尸进程
    init: true
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${HOST_PORT:-8833}:8833"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Chrome 需要较大的 /dev/shm，否则标签页易崩。按并发登录会话数量调整：
    # 经验值约每会话 ~256MB，留足余量；如并发很高（如 40+）可上调到 16g。
    shm_size: "8gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8833/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
