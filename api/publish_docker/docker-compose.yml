services:
  publish-docker:
    build:
      context: ../..
      dockerfile: api/publish_docker/Dockerfile
    container_name: publish-docker-phase1
    env_file:
      - .env.example
      - .env
    ports:
      - "${HOST_SERVICE_PORT:-18000}:${SERVICE_PORT:-8000}"
      - "${HOST_NOVNC_PORT:-16080}:6080"
    volumes:
      - ../../logs:/app/logs
    restart: unless-stopped
