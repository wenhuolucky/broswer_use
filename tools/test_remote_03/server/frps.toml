# FRP 服务端配置 — 部署到有公网 IP 的国内 VPS
# 使用前请修改 auth.token

bindPort = 7000

# 认证方式
auth.method = "token"
auth.token = "your_secure_token_here"

# Dashboard（可选，用于监控连接状态）
webServer.addr = "0.0.0.0"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "admin123"

# 日志
log.to = "./frps.log"
log.level = "info"
log.maxDays = 3

# 允许的端口范围（限制客户端只能绑定这些端口，安全加固）
allowPorts = [
  { start = 6801, end = 6803 },  # noVNC 端口
  { start = 6901, end = 6903 },  # CDP 端口
]