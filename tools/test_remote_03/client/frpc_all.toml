# FRP 客户端配置 — 全用户合并
# 同时为 user1/user2/user3 建立隧道
# 使用前请修改 serverAddr 和 auth.token

serverAddr = "x.x.x.x"
serverPort = 7000

auth.method = "token"
auth.token = "your_secure_token_here"

# 日志
log.to = "./frpc_all.log"
log.level = "info"
log.maxDays = 3

# ==================== user1 ====================
[[proxies]]
name = "user1-noVNC"
type = "tcp"
localIP = "127.0.0.1"
localPort = 6081
remotePort = 6801

[[proxies]]
name = "user1-CDP"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9227
remotePort = 6901

# ==================== user2 ====================
[[proxies]]
name = "user2-noVNC"
type = "tcp"
localIP = "127.0.0.1"
