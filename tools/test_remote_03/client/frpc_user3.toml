# FRP 客户端配置 — user3
# 使用前请修改 serverAddr 和 auth.token

serverAddr = "x.x.x.x"
serverPort = 7000

auth.method = "token"
auth.token = "your_secure_token_here"

# 日志
log.to = "./frpc_user3.log"
log.level = "info"
log.maxDays = 3

# user3 的 noVNC 端口映射
[[proxies]]
name = "user3-noVNC"
type = "tcp"
localIP = "127.0.0.1"
localPort = 6083
remotePort = 6803

# user3 的 CDP 端口映射
[[proxies]]
name = "user3-CDP"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9247
remotePort = 6903